name: Education System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: university_ci
          POSTGRES_USER: university_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U university_ci -d university_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/university_ci
      SPRING_DATASOURCE_USERNAME: university_ci
      SPRING_DATASOURCE_PASSWORD: ci_only_password

    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate a temporary JWT key
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: education-system-${{ github.sha }}
          path: target/education-system-*.jar
          if-no-files-found: error
          retention-days: 7
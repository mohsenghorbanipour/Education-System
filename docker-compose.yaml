services:
  postgres:
    image: postgres:17-alpine
    container_name: university-postgres

    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: university_app
      POSTGRES_PASSWORD: university_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university_app -d university_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
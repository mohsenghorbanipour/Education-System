server {
    listen 80;
    server_name api.mohsendev20.ir;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://api.mohsendev20.ir$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.mohsendev20.ir;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/education-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/education-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EducationTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1m;

    location ~ ^/(api/|swagger-ui/|swagger-ui\.html$|v3/api-docs(?:/|$|\.yaml$)) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
